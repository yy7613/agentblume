<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>レシート サンプルマート</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #d9d9d9; }
  .paper { width: 300px; margin: 16px auto; background: #fff; padding: 18px 16px 26px; box-sizing: border-box; font-family: "MS Gothic", "BIZ UDGothic", "Osaka-Mono", "Noto Sans Mono CJK JP", monospace; font-size: 12.5px; color: #222; line-height: 1.55; }
  .c { text-align: center; }
  .co { font-size: 16px; font-weight: bold; }
  .row { display: flex; justify-content: space-between; }
  .row .l { white-space: pre; }
  .dots { border-top: 1px dashed #666; margin: 6px 0; }
  .big { font-size: 15px; font-weight: bold; }
  .small { font-size: 11px; color: #444; }
</style>
</head>
<body>
<div class="paper">
  <div class="c co">サンプルマート</div>

  <div class="c small">TEL 03-0000-0002</div>
  <div class="c small">登録番号 T9876543210987</div>
  <div class="dots"></div>
  <div class="row"><span>2026年09月03日(木) 12:34</span><span>レジ0003</span></div>
  <div class="row"><span>責 テスト</span><span>No.1234</span></div>
  <div class="dots"></div>
  <div class="row"><span class="l">お茶 500ml ※</span><span></span></div>
  <div class="row"><span class="l">  @150 × 2</span><span>¥300</span></div>
  <div class="row"><span class="l">サンドイッチ ※</span><span>¥380</span></div>
  <div class="row"><span class="l">ボールペン 黒 3本組</span><span>¥330</span></div>
  <div class="row"><span class="l">クリアファイル 10枚</span><span>¥220</span></div>
  <div class="dots"></div>
  <div class="row"><span>小計</span><span>¥1,230</span></div>
  <div class="row big"><span>合計</span><span>¥1,230</span></div>
  <div class="row"><span>(8%対象 ※</span><span>¥680)</span></div>
  <div class="row small"><span>  内消費税等</span><span>¥50</span></div>
  <div class="row"><span>(10%対象</span><span>¥550)</span></div>
  <div class="row small"><span>  内消費税等</span><span>¥50</span></div>
  <div class="dots"></div>
  <div class="row"><span>お預り</span><span>¥2,000</span></div>

  <div class="small">※は軽減税率対象商品です</div>

</div>
</body>
</html>
